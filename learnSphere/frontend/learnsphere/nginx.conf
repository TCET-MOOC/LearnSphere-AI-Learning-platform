server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # W7-03: the production build calls same-origin paths only (environment.prod.ts).
    # nginx forwards them to the services on the Compose network. /internal/** is a
    # service-to-service route and is deliberately not exposed.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Payments service: Razorpay orders/verify and the gateway webhook.
    location ^~ /api/payments/orders {
        proxy_pass http://payments:8081;
    }
    location ^~ /api/payments/webhook {
        proxy_pass http://payments:8081;
    }

    # Main backend: every other /api path (including /api/payments/history).
    # ^~ stops the static-asset regex below from catching API paths that end in .png etc.
    location ^~ /api/ {
        client_max_body_size 200m;  # matches spring.servlet.multipart.max-request-size
        proxy_pass http://backend:8080;
    }

    # STOMP over native WebSocket.
    location ^~ /ws-native {
        proxy_pass http://backend:8080;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    # Angular is a single-page application: unknown paths must render the shell.
    # W7-13: the shell is revalidated on every load so a deploy is picked up at once.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # W7-13 (NFR-02): content-hashed build output (angular.json outputHashing "all") changes
    # its name whenever its content changes, so it is cached for a year and never revalidated.
    location ~ "-[A-Z0-9]{8}\.(?:js|css|woff2?|ttf|png|jpe?g|gif|svg|webp|ico)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Unhashed static files (favicons, logos, manifest) keep their name across deploys:
    # cache briefly and never mark them immutable.
    location ~* \.(?:js|css|woff2?|ttf|png|jpe?g|gif|svg|webp|ico|webmanifest)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }
}
