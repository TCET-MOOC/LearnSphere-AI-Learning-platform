<div class="sidebar-backdrop" *ngIf="isMobileOpen$ | async" (click)="closeMobile()"></div>

<aside class="sidebar" [class.collapsed]="isCollapsed$ | async" [class.mobile-open]="isMobileOpen$ | async">
  <div class="sidebar__brand" tabindex="0" role="button" [attr.aria-label]="(isCollapsed$ | async) ? 'Expand sidebar' : 'Collapse sidebar'" (click)="toggleSidebar()" (keydown.enter)="toggleSidebar()">
    <div class="brand-content">
      <div class="logo-box">
        <span class="logo-letters">LS</span>
        <div class="logo-overlay">
          <svg *ngIf="!(isCollapsed$ | async)" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m16 15-3-3 3-3"/></svg>
          <svg *ngIf="isCollapsed$ | async" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m14 9 3 3-3 3"/></svg>
        </div>
      </div>
      <h2 class="logo-text">LearnSphere</h2>
    </div>
  </div>

  <nav class="sidebar__nav">
    <a routerLink="/student/dashboard" routerLinkActive="active" class="nav-item" [title]="(isCollapsed$ | async) ? 'Dashboard' : ''">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect>
      </svg>
      <span class="nav-label">Dashboard</span>
    </a>

    <a routerLink="/student/courses" routerLinkActive="active" class="nav-item" [title]="(isCollapsed$ | async) ? 'My Courses' : ''">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"></path>
      </svg>
      <span class="nav-label">My Courses</span>
    </a>

    <a routerLink="/student/lectures" routerLinkActive="active" class="nav-item" [title]="(isCollapsed$ | async) ? 'Video Lectures' : ''">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><polygon points="10 8 16 10 10 12 10 8"></polygon><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line>
      </svg>
      <span class="nav-label">Video Lectures</span>
    </a>

    <a routerLink="/student/notes" routerLinkActive="active" class="nav-item" [title]="(isCollapsed$ | async) ? 'Notes' : ''">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline>
      </svg>
      <span class="nav-label">Notes</span>
    </a>

    <a routerLink="/student/assessments" routerLinkActive="active" class="nav-item" [title]="(isCollapsed$ | async) ? 'Assessments' : ''">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect><path d="M9 14h6"></path><path d="M9 18h6"></path><path d="M9 10h.01"></path>
      </svg>
      <span class="nav-label">Assessments</span>
    </a>

    <a routerLink="/student/bookmarks" routerLinkActive="active" class="nav-item" [title]="(isCollapsed$ | async) ? 'Bookmarks' : ''">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
      </svg>
      <span class="nav-label">Bookmarks</span>
    </a>

    <a routerLink="/student/leaderboard" routerLinkActive="active" class="nav-item" [title]="(isCollapsed$ | async) ? 'Leaderboard' : ''">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="7"></circle><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline>
      </svg>
      <span class="nav-label">Leaderboard</span>
    </a>

    <a routerLink="/student/discussion" routerLinkActive="active" class="nav-item" [title]="(isCollapsed$ | async) ? 'Discussion' : ''">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
      </svg>
      <span class="nav-label">Discussion</span>
    </a>

    <a routerLink="/student/live" routerLinkActive="active" class="nav-item" [title]="(isCollapsed$ | async) ? 'Live Sessions' : ''">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"></path>
        <path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"></path>
        <circle cx="12" cy="12" r="2"></circle>
        <path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"></path>
        <path d="M19.1 4.9C23 8.8 23 15.1 19.1 19"></path>
      </svg>
      <span class="nav-label">Live Sessions</span>
    </a>

    <a routerLink="/student/certificates" routerLinkActive="active" class="nav-item" [title]="(isCollapsed$ | async) ? 'Certificates' : ''">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path>
      </svg>
      <span class="nav-label">Certificates</span>
    </a>

    <a routerLink="/student/purchases" routerLinkActive="active" class="nav-item" [title]="(isCollapsed$ | async) ? 'My Purchases' : ''">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line>
      </svg>
      <span class="nav-label">My Purchases</span>
    </a>
  </nav>

  <div class="sidebar__bottom">
    <a routerLink="/student/settings" routerLinkActive="active" class="nav-item" [title]="(isCollapsed$ | async) ? 'Settings' : ''">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
      <span class="nav-label">Settings</span>
    </a>
  </div>
</aside>
