<div class="video-player-root" #playerContainer>

  <!-- Video Shell (Wraps Default YouTube Player and Native HTML5 Video) -->
  <div class="video-player__shell" *ngIf="src; else noSrc">

    <!-- 1. Default YouTube Player (Standard Native UI) -->
    <div class="yt-wrapper" *ngIf="isYouTube">
      <div #ytContainer class="yt-container"></div>

      <!-- YouTube Error / Restricted Embed Fallback Card -->
      <div class="yt-error-fallback" *ngIf="ytError">
        <div class="yt-error-card">
          <div class="yt-error-icon">
            <lucide-icon name="alert-triangle" [size]="32"></lucide-icon>
          </div>
          <h3>Video Playback Notice</h3>
          <p>{{ ytError }}</p>
          <div class="yt-error-actions">
            <button class="yt-retry-btn" type="button" (click)="retryPlayback()">
              <lucide-icon name="refresh-cw" [size]="15"></lucide-icon>
              <span>Retry</span>
            </button>
            <a [href]="youtubeExternalUrl" target="_blank" rel="noopener noreferrer" class="yt-watch-btn">
              <lucide-icon name="external-link" [size]="15"></lucide-icon>
              <span>Watch on YouTube</span>
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- 2. Native HTML5 Video Engine (Default Browser Controls) -->
    <video
      *ngIf="!isYouTube && resolvedSrc"
      #videoEl
      [src]="resolvedSrc"
      [poster]="poster || undefined"
      controls
      (play)="onPlay()"
      (pause)="onPause()"
      (ended)="onEnded()"
      (loadedmetadata)="onLoadedMetadata()"
      (timeupdate)="onTimeUpdate()"
      playsinline>
    </video>

    <!-- Floating Auto-Resume Pill -->
    <div class="resume-banner" *ngIf="showResumeBanner && !ytError">
      <div class="resume-info">
        <lucide-icon name="clock" [size]="14" class="resume-icon"></lucide-icon>
        <span>Resumed from <strong>{{ formatTime(resumedTime) }}</strong></span>
      </div>
      <button class="resume-btn" type="button" (click)="restartFromBeginning()">Start over</button>
      <button class="resume-close" type="button" (click)="dismissResumeBanner()" aria-label="Dismiss">
        <lucide-icon name="x" [size]="12"></lucide-icon>
      </button>
    </div>

  </div>

  <!-- Empty State Fallback -->
  <ng-template #noSrc>
    <div class="video-player__empty">
      <div class="empty-icon-wrap">
        <lucide-icon name="sparkles" [size]="28"></lucide-icon>
      </div>
      <h4>Video Streaming Ready</h4>
      <p>No video content has been linked to this lecture yet.</p>
    </div>
  </ng-template>

</div>
