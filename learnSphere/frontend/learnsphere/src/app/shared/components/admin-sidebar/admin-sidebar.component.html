<div class="sidebar-backdrop" *ngIf="isMobileOpen$ | async" (click)="closeMobile()"></div>

<aside class="sidebar-dark" [class.collapsed]="isCollapsed$ | async" [class.mobile-open]="isMobileOpen$ | async">
  <div class="sidebar__brand" tabindex="0" role="button" [attr.aria-label]="(isCollapsed$ | async) ? 'Expand sidebar' : 'Collapse sidebar'" (click)="toggleSidebar()" (keydown.enter)="toggleSidebar()">
    <div class="brand-content">
      <div class="logo-box">
        <span class="logo-letters">LS</span>
        <div class="logo-overlay">
          <lucide-icon [name]="(isCollapsed$ | async) ? 'chevron-right' : 'chevron-down'" [size]="18"></lucide-icon>
        </div>
      </div>
      <h2 class="logo-text">LearnSphere</h2>
    </div>
  </div>

  <nav class="sidebar__nav">
    <a routerLink="/admin/dashboard" routerLinkActive="active" class="nav-item" [title]="(isCollapsed$ | async) ? 'Dashboard' : ''">
      <lucide-icon name="target" class="nav-icon" [size]="18"></lucide-icon>
      <span class="nav-label">Dashboard</span>
    </a>

    <a routerLink="/admin/users" routerLinkActive="active" class="nav-item" [title]="(isCollapsed$ | async) ? 'User management' : ''">
      <lucide-icon name="users" class="nav-icon" [size]="18"></lucide-icon>
      <span class="nav-label">User management</span>
    </a>

    <a routerLink="/admin/courses" routerLinkActive="active" class="nav-item" [title]="(isCollapsed$ | async) ? 'Course approvals' : ''">
      <lucide-icon name="book-open" class="nav-icon" [size]="18"></lucide-icon>
      <span class="nav-label">Course approvals</span>
    </a>

    <a routerLink="/admin/colleges" routerLinkActive="active" class="nav-item" [title]="(isCollapsed$ | async) ? 'College management' : ''">
      <lucide-icon name="graduation-cap" class="nav-icon" [size]="18"></lucide-icon>
      <span class="nav-label">College management</span>
    </a>

    <div class="divider"></div>

    <a routerLink="/admin/revenue" routerLinkActive="active" class="nav-item" [title]="(isCollapsed$ | async) ? 'Revenue' : ''">
      <lucide-icon name="dollar-sign" class="nav-icon" [size]="18"></lucide-icon>
      <span class="nav-label">Revenue</span>
    </a>

    <a routerLink="/admin/payouts" routerLinkActive="active" class="nav-item" [title]="(isCollapsed$ | async) ? 'Payouts' : ''">
      <lucide-icon name="banknote" class="nav-icon" [size]="18"></lucide-icon>
      <span class="nav-label">Payouts</span>
    </a>

    <a routerLink="/admin/reports" routerLinkActive="active" class="nav-item" [title]="(isCollapsed$ | async) ? 'Reports' : ''">
      <lucide-icon name="bar-chart" class="nav-icon" [size]="18"></lucide-icon>
      <span class="nav-label">Reports</span>
    </a>

    <div class="divider"></div>

    <a routerLink="/admin/flagged" routerLinkActive="active" class="nav-item" [title]="(isCollapsed$ | async) ? 'Flagged content' : ''">
      <lucide-icon name="flag" class="nav-icon" [size]="18"></lucide-icon>
      <span class="nav-label">Flagged content</span>
    </a>

    <a routerLink="/admin/sentiment" routerLinkActive="active" class="nav-item" [title]="(isCollapsed$ | async) ? 'Sentiment analysis' : ''">
      <lucide-icon name="sparkles" class="nav-icon" [size]="18"></lucide-icon>
      <span class="nav-label">Sentiment analysis</span>
    </a>

    <a routerLink="/admin/announcements" routerLinkActive="active" class="nav-item" [title]="(isCollapsed$ | async) ? 'Announcements' : ''">
      <lucide-icon name="megaphone" class="nav-icon" [size]="18"></lucide-icon>
      <span class="nav-label">Announcements</span>
    </a>

    <a routerLink="/admin/messages" routerLinkActive="active" class="nav-item" [title]="(isCollapsed$ | async) ? 'Messages' : ''">
      <lucide-icon name="message-square" class="nav-icon" [size]="18"></lucide-icon>
      <span class="nav-label">Messages</span>
    </a>
  </nav>

  <div class="sidebar__bottom">
    <a routerLink="/admin/settings" routerLinkActive="active" class="nav-item" [title]="(isCollapsed$ | async) ? 'Settings' : ''">
      <lucide-icon name="settings" class="nav-icon" [size]="18"></lucide-icon>
      <span class="nav-label">Settings</span>
    </a>
  </div>
</aside>
