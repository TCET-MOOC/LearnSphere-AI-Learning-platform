<header class="topbar">
  <div class="topbar__left">
    <button class="icon-btn mobile-menu-btn" (click)="toggleMobileSidebar()" aria-label="Toggle navigation menu">
      <lucide-icon name="menu" [size]="20"></lucide-icon>
    </button>
    <div class="search-box">
      <lucide-icon name="search" [size]="16" class="search-icon"></lucide-icon>
      <input type="text" placeholder="Search courses, notes...">
    </div>
  </div>
  
  <div class="topbar__right">

    <!-- Universal Theme Toggle Button (Light/Dark Switch) -->
    <button 
      class="icon-btn theme-btn" 
      [title]="isDarkMode ? 'Switch to Light theme' : 'Switch to Dark theme'" 
      (click)="toggleTheme()">
      <lucide-icon [name]="isDarkMode ? 'sun' : 'moon'" [size]="18"></lucide-icon>
    </button>
  
    <button class="icon-btn" title="Messages" [routerLink]="getMessagesRoute()">
      <lucide-icon name="message-square" [size]="18"></lucide-icon>
    </button>

    <button class="icon-btn" title="Announcements" [routerLink]="getRoleRoute('announcements')" routerLinkActive="active">
      <lucide-icon name="megaphone" [size]="18"></lucide-icon>
    </button>

    <div class="notification-container" style="position: relative;">
      <button class="icon-btn" title="Notifications" (click)="toggleNotifications()">
        <lucide-icon name="bell" [size]="18"></lucide-icon>
        <span class="badge badge--count" *ngIf="unreadNotifications">{{ unreadNotifications > 9 ? '9+' : unreadNotifications }}</span>
      </button>

      <div class="dropdown-backdrop" *ngIf="isNotificationsOpen" (click)="closeNotifications()"></div>

      <div class="profile-dropdown notifications-dropdown" *ngIf="isNotificationsOpen">
        <div class="dropdown-header">
          <div class="header-left">
            <span>Notifications</span>
            <span class="unread-pill" *ngIf="unreadNotifications">{{ unreadNotifications }} New</span>
          </div>
          <button class="btn-text" (click)="markAllAsRead()" *ngIf="unreadNotifications > 0">Mark all read</button>
        </div>
        
        <div class="notifications-list">
          <div 
            class="notification-item" 
            *ngFor="let n of notifications" 
            [class.unread]="!n.read"
            (click)="onNotificationClick(n)">
            
            <div class="notification-icon" [attr.data-category]="n.category">
              <lucide-icon [name]="getNotificationIcon(n.category)" [size]="16"></lucide-icon>
            </div>
            
            <div class="notification-content">
              <div class="notif-head">
                <strong class="notif-title">{{ n.title }}</strong>
                <span class="unread-dot" *ngIf="!n.read"></span>
              </div>
              <p class="notif-body">{{ n.body }}</p>
              <span class="notif-time">{{ n.time }}</span>
            </div>
          </div>

          <div class="notification-item-empty" *ngIf="notifications.length === 0">
            <div class="empty-icon">
              <lucide-icon name="bell" [size]="24"></lucide-icon>
            </div>
            <strong>All caught up!</strong>
            <p>You have no new notifications.</p>
          </div>
        </div>

        <div class="dropdown-footer">
          <button class="dropdown-item" [routerLink]="getRoleRoute('notifications')" (click)="closeNotifications()">
            <span>View all notifications</span>
            <lucide-icon name="chevron-right" [size]="14"></lucide-icon>
          </button>
        </div>
      </div>
    </div>

    <div class="profile-container">
      
      <div class="avatar" (click)="toggleMenu()">
        {{ userInitials }}
      </div>

      <div class="dropdown-backdrop" *ngIf="isMenuOpen" (click)="closeMenu()"></div>

      <div class="profile-dropdown" *ngIf="isMenuOpen">
        
        <div class="dropdown-header">
          <div class="user-name">{{ userName }}</div>
          <div class="user-email">{{ userEmail }}</div>
        </div>
        
        <div class="dropdown-divider"></div>

        <button class="dropdown-item" type="button" (click)="toggleTheme()">
          <lucide-icon [name]="isDarkMode ? 'sun' : 'moon'" [size]="16"></lucide-icon>
          <span>{{ isDarkMode ? 'Light Mode' : 'Dark Mode' }}</span>
        </button>

        <a class="dropdown-item" [routerLink]="getRoleRoute('profile')" (click)="closeMenu()">
          <lucide-icon name="user" [size]="16"></lucide-icon>
          <span>View profile</span>
        </a>

        <a class="dropdown-item" [routerLink]="getRoleRoute('settings')" (click)="closeMenu()">
          <lucide-icon name="settings" [size]="16"></lucide-icon>
          <span>Settings</span>
        </a>

        <div class="dropdown-divider"></div>
        
        <button class="dropdown-item text-danger" (click)="signOut()">
          <lucide-icon name="x" [size]="16"></lucide-icon>
          <span>Sign out</span>
        </button>
        
      </div>
    </div>

  </div>
</header>
