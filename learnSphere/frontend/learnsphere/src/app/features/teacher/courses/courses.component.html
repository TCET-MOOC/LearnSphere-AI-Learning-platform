<div class="teacher-courses">
  <header class="page-head">
    <div>
      <p class="eyebrow">Teacher view</p>
      <h1>My Courses</h1>
    </div>
    <a class="btn btn--primary" routerLink="/teacher/courses/new">New course</a>
  </header>

  <nav class="tabs" aria-label="Course status filters">
    <button
      class="tab"
      *ngFor="let filter of filters"
      [class.tab--active]="filter.key === activeFilter"
      (click)="setFilter(filter.key)"
      type="button">
      {{ filter.label }}
    </button>
  </nav>

  <section class="metric-grid" aria-label="Course metrics">
    <article class="metric-card" *ngFor="let metric of metrics">
      <span>{{ metric.label }}</span>
      <strong>{{ metric.value }}</strong>
      <small>{{ metric.sub }}</small>
    </article>
  </section>

  <div class="course-layout">
    <section class="course-stack">
      <p class="hint" *ngIf="loading">Loading your courses…</p>
      <app-teacher-course-card
        *ngFor="let course of filteredCourses"
        [course]="course"
        (remove)="onDelete($event)">
      </app-teacher-course-card>
      <p class="hint" *ngIf="!loading && filteredCourses.length === 0">
        No courses in this filter. Create your first course to get started.
      </p>
    </section>

    <aside class="side-stack">
      <section class="card">
        <div class="card-head">
          <h2>Quick actions</h2>
        </div>
        <div class="action-grid">
          <a class="btn btn--primary" routerLink="/teacher/courses/new">New course</a>
          <a class="btn btn--ghost" routerLink="/teacher/upload">Upload content</a>
        </div>
      </section>
    </aside>
  </div>
</div>
