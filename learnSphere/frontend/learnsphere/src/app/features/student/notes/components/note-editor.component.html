<div class="note-editor-wrapper">
  <!-- Top brand gradient bar -->
  <div class="note-editor-brand-bar"></div>

  <div class="note-editor">
    <div class="note-editor__header">
      <h2 mat-dialog-title class="note-editor__title">
        {{ isEditMode ? 'Edit Note' : 'Create New Note' }}
      </h2>
      <button type="button" class="close-dialog-btn" (click)="onCancel()" [attr.aria-label]="ui.closeDialog">×</button>
    </div>
    
    <div mat-dialog-content class="note-editor__content">
      <form [formGroup]="noteForm" (submit)="onSubmit()" class="editor-form">
        
        <!-- Read-only lecture mapping details -->
        <div class="form-group readonly-group" *ngIf="lectureId">
          <label class="form-label">{{ ui.linkedLecture }}</label>
          <div class="readonly-value">
            <span class="course-badge">{{ courseName }}</span>
            <span class="lecture-badge" style="display:inline-flex; align-items:center; gap:4px;">
              <span class="icon"><lucide-icon name="video" style="width:14px; height:14px;"></lucide-icon></span> {{ lectureLabel }}
            </span>
            <span class="timestamp-badge" style="display:inline-flex; align-items:center; gap:4px;">
              <span class="icon"><lucide-icon name="clock" style="width:14px; height:14px;"></lucide-icon></span> {{ timestampSeconds * 1000 | date:'mm:ss':'UTC' }}
            </span>
          </div>
        </div>

        <!-- Title text field -->
        <div class="form-group">
          <div class="form-label-row">
            <label for="note-title" class="form-label">{{ ui.noteTitle }}</label>
            <span class="char-counter" [class.limit-near]="(noteForm.get('title')?.value?.length || 0) > 85">
              {{ noteForm.get('title')?.value?.length || 0 }}/100
            </span>
          </div>
          <div class="input-wrapper">
            <input id="note-title" 
                   type="text" 
                   formControlName="title" 
                   class="form-control" 
                   [attr.placeholder]="ui.enterADescriptiveNote" />
          </div>
          <div class="error-msg" *ngIf="noteForm.get('title')?.touched && noteForm.get('title')?.invalid">
            {{ ui.titleIsRequiredMaximum }}
          </div>
        </div>

        <!-- Content text block with Markdown toolbar -->
        <div class="form-group">
          <label for="note-content" class="form-label">{{ ui.noteContent }}</label>
          <div class="editor-textarea-container">
            <!-- Styling Toolbar for markdown -->
            <div class="markdown-toolbar">
              <button type="button" class="toolbar-btn" (click)="insertFormatting('bold')" [attr.title]="ui.boldCtrlB">
                <strong>B</strong>
              </button>
              <button type="button" class="toolbar-btn" (click)="insertFormatting('italic')" [attr.title]="ui.italicCtrlI">
                <em>I</em>
              </button>
              <button type="button" class="toolbar-btn" (click)="insertFormatting('code')" [attr.title]="ui.inlineCode">
                <code>&lt;/&gt;</code>
              </button>
              <button type="button" class="toolbar-btn" (click)="insertFormatting('list')" [attr.title]="ui.bulletList">
                {{ ui.list }}
              </button>
              <div class="toolbar-divider"></div>
              <span class="toolbar-tip">{{ ui.supportsMarkdownBoldItalic }}</span>
            </div>
            
            <textarea id="note-content" 
                      formControlName="content" 
                      class="form-control textarea" 
                      [attr.placeholder]="ui.writeYourNotesHere"></textarea>
          </div>
          <div class="error-msg" *ngIf="noteForm.get('content')?.touched && noteForm.get('content')?.invalid">
            {{ ui.noteContentCannotBe }}
          </div>
        </div>

        <!-- Tag chip inputs -->
        <div class="form-group">
          <label for="note-tag" class="form-label">{{ ui.tags }}</label>
          <div class="tag-input-container">
            <div class="tag-input-wrap">
              <span class="tag-prefix">#</span>
              <input id="note-tag" 
                     type="text" 
                     [(ngModel)]="currentTag" 
                     [ngModelOptions]="{standalone: true}" 
                     (keydown.enter)="addTag($event)" 
                     class="form-control tag-input" 
                     [attr.placeholder]="ui.typeTagAndPress" />
            </div>
            <button type="button" class="btn btn--secondary btn--sm" (click)="addTag($event)">{{ ui.addTag }}</button>
          </div>
          
          <!-- Rendered tags array -->
          <div class="tags-chips-container" *ngIf="tags.length > 0">
            <span class="chip" *ngFor="let t of tags">
              #{{ t }}
              <button type="button" class="chip__remove-btn" (click)="removeTag(t)" [attr.aria-label]="ui.removeTag">×</button>
            </span>
          </div>
        </div>

        <!-- Actions -->
        <div mat-dialog-actions class="editor-actions">
          <button type="button" class="btn btn--ghost" (click)="onCancel()">{{ ui.cancel }}</button>
          <button type="submit" class="btn btn--primary" [disabled]="noteForm.invalid">
            {{ isEditMode ? 'Save Changes' : 'Create Note' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
