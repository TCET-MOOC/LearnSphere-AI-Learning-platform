<div class="lecture-page">
  <header class="page-head">
    <div>
      <p class="eyebrow">Student view</p>
      <h1>Video Lectures</h1>
    </div>
  </header>

  <p class="hint" *ngIf="loading">Loading…</p>

  <ng-container *ngIf="!loading">
    <section class="player-card" *ngIf="currentLecture; else noLecture">
      <div class="player-head">
        <div>
          <h2>Now playing — {{ course?.title || 'Course' }}</h2>
          <p>Lec {{ currentLecture.number }} · {{ currentLecture.title }}</p>
        </div>
        <div class="player-head__actions">
          <span class="pill pill--purple">{{ watchedPercent }}% watched</span>
          <button class="btn btn--soft" type="button" (click)="addBookmark()">Bookmark moment</button>
          <button class="btn btn--soft" type="button" (click)="markComplete()">Mark complete</button>
        </div>
      </div>

      <app-video-player
        [src]="currentLecture.videoUrl"
        (timeUpdate)="onTimeUpdate($event)">
      </app-video-player>
    </section>

    <ng-template #noLecture>
      <section class="card">
        <p class="hint">No lecture selected yet. Enroll in a course to start watching.</p>
      </section>
    </ng-template>

    <div class="lecture-layout">
      <section class="card">
        <div class="card-head">
          <h2>Lecture library</h2>
          <span class="pill pill--grey">{{ lectures.length }} lectures</span>
        </div>

        <app-lecture-grid
          [lectures]="lectures"
          [currentLectureId]="currentLecture?.id ?? null"
          [completedIds]="completedIds"
          (select)="onLectureGridSelect($event)">
        </app-lecture-grid>
      </section>

      <aside class="side-stack">
        <app-notes-drawer
          [courseId]="courseId ?? undefined"
          [courseName]="course?.title || ''"
          [lectureId]="currentLecture?.id"
          [lectureLabel]="currentLecture ? ('Lec ' + currentLecture.number + ': ' + currentLecture.title) : ''"
          [timestampSeconds]="playbackPosition">
        </app-notes-drawer>
      </aside>
    </div>
  </ng-container>
</div>
