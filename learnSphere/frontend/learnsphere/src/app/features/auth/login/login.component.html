<div class="auth-layout">
  <div class="auth-card">
    <div class="brand">
      <div class="logo-box">LS</div>
      <h2>Welcome back</h2>
      <p>Please enter your details to sign in.</p>
    </div>

    <div class="error-banner" *ngIf="errorMessage">{{ errorMessage }}</div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">

      <div class="form-group">
        <label for="email">College Email</label>
        <input type="email" id="email" formControlName="email" placeholder="Enter your email" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" formControlName="password" placeholder="••••••••" />
      </div>

      <div class="form-actions">
        <a routerLink="/forgot-password" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn-submit" [disabled]="loginForm.invalid || submitting">
        {{ submitting ? 'Signing in…' : 'Sign In' }}
      </button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a routerLink="/register">Sign up</a></p>
    </div>
  </div>
</div>
