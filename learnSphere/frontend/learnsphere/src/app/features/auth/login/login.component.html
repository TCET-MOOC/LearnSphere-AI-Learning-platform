<div class="auth-layout">
  <div class="auth-card">
    <div class="brand">
      <a routerLink="/" class="logo-link" title="LearnSphere Home">
        <div class="logo-box">
          <img src="/logo-mark.svg" alt="LearnSphere AI" class="logo-img" />
        </div>
      </a>
      <h2>Welcome back</h2>
      <p>Please enter your details to sign in.</p>
    </div>

    <div class="error-banner" *ngIf="errorMessage">{{ errorMessage }}</div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">

      <div class="form-group">
        <label for="email">College Email</label>
        <input type="email" id="email" formControlName="email" placeholder="Enter your email" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" formControlName="password" placeholder="8–16 chars (e.g. Pass@123)" />
        <small class="field-hint" [class.field-error]="passwordControl?.touched && passwordControl?.invalid">
          8–16 characters, min. 1 uppercase letter, 1 number, and 1 special character.
        </small>
        <div class="error-text" *ngIf="passwordControl?.touched && passwordControl?.invalid">
          <span *ngIf="passwordControl?.errors?.['required']">Password is required.</span>
          <span *ngIf="!passwordControl?.errors?.['required'] && passwordControl?.errors?.['invalidPassword']">
            Must be 8–16 characters with 1 uppercase, 1 number, and 1 special character.
          </span>
        </div>
      </div>

      <div class="form-actions">
        <a routerLink="/forgot-password" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn-submit" [disabled]="loginForm.invalid || submitting">
        {{ submitting ? 'Signing in…' : 'Sign In' }}
      </button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a routerLink="/register">Sign up</a></p>
    </div>
  </div>
</div>
