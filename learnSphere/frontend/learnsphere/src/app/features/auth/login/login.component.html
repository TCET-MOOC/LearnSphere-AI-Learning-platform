<div class="auth-layout">
  <div class="auth-card">
    <div class="brand">
      <a routerLink="/" class="logo-link" [title]="copy.homeLinkTitle">
        <div class="logo-box">
          <img src="/logo-mark.svg" [alt]="copy.logoAlt" class="logo-img" />
        </div>
      </a>
      <h2>{{ copy.title }}</h2>
      <p>{{ copy.subtitle }}</p>
    </div>

    <div class="session-notice" role="status" *ngIf="sessionNotice && !errorMessage">{{ sessionNotice }}</div>
    <div class="error-banner" *ngIf="errorMessage">{{ errorMessage }}</div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">

      <div class="form-group">
        <label for="email">{{ copy.emailLabel }}</label>
        <input type="email" id="email" formControlName="email" [placeholder]="copy.emailPlaceholder" />
      </div>

      <div class="form-group">
        <label for="password">{{ copy.passwordLabel }}</label>
        <input type="password" id="password" formControlName="password" [placeholder]="copy.passwordPlaceholder" />
        <small class="field-hint" [class.field-error]="passwordControl?.touched && passwordControl?.invalid">
          {{ copy.passwordHint }}
        </small>
        <div class="error-text" *ngIf="passwordControl?.touched && passwordControl?.invalid">
          <span *ngIf="passwordControl?.errors?.['required']">{{ copy.passwordRequired }}</span>
          <span *ngIf="!passwordControl?.errors?.['required'] && passwordControl?.errors?.['invalidPassword']">
            {{ copy.passwordInvalid }}
          </span>
        </div>
      </div>

      <div class="form-actions">
        <a routerLink="/forgot-password" class="forgot-link">{{ copy.forgotPassword }}</a>
      </div>

      <button type="submit" class="btn-submit" [disabled]="loginForm.invalid || submitting">
        {{ submitting ? copy.submitting : copy.submit }}
      </button>
    </form>

    <div class="auth-footer">
      <p>{{ copy.noAccount }} <a routerLink="/register">{{ copy.signUp }}</a></p>
    </div>
  </div>
</div>
