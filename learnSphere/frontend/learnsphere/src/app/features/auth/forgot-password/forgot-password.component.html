<div class="auth-layout">
  <div class="auth-card">
    <div class="brand">
      <div class="logo-box">LS</div>
      <h2>Reset your password</h2>
      <p *ngIf="step === 'request'">Enter your account email to get a reset code.</p>
      <p *ngIf="step === 'reset'">Enter the reset code and your new password.</p>
      <p *ngIf="step === 'done'">All set — your password has been updated.</p>
    </div>

    <div class="error-banner" *ngIf="errorMessage">{{ errorMessage }}</div>
    <div class="info-banner" *ngIf="infoMessage && step === 'reset'">{{ infoMessage }}</div>

    <form *ngIf="step === 'request'" [formGroup]="requestForm" (ngSubmit)="submitRequest()" class="auth-form">
      <div class="form-group">
        <label for="email">College Email</label>
        <input type="email" id="email" formControlName="email" placeholder="Enter your email" />
      </div>
      <button type="submit" class="btn-submit" [disabled]="requestForm.invalid || submitting">
        {{ submitting ? 'Sending…' : 'Send reset code' }}
      </button>
    </form>

    <form *ngIf="step === 'reset'" [formGroup]="resetForm" (ngSubmit)="submitReset()" class="auth-form">
      <div class="form-group">
        <label for="token">Reset code</label>
        <input type="text" id="token" formControlName="token" placeholder="Paste your reset code" />
      </div>
      <div class="form-group">
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" formControlName="newPassword" placeholder="Min. 6 characters" />
      </div>
      <button type="submit" class="btn-submit" [disabled]="resetForm.invalid || submitting">
        {{ submitting ? 'Resetting…' : 'Reset password' }}
      </button>
    </form>

    <div *ngIf="step === 'done'" class="auth-form">
      <button type="button" class="btn-submit" (click)="goToLogin()">Back to sign in</button>
    </div>

    <div class="auth-footer">
      <p>Remembered your password? <a routerLink="/login">Sign in</a></p>
    </div>
  </div>
</div>
