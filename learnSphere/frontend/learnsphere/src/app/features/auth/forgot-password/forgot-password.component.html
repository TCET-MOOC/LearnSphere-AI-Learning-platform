<div class="auth-layout">
  <div class="auth-card">
    <div class="brand">
      <a routerLink="/" class="logo-link" [title]="copy.homeLinkTitle">
        <div class="logo-box">
          <img src="/logo-mark.svg" [alt]="copy.logoAlt" class="logo-img" />
        </div>
      </a>
      <h2>{{ copy.title }}</h2>
      <p *ngIf="step === 'request'">{{ copy.requestIntro }}</p>
      <p *ngIf="step === 'reset'">{{ copy.resetIntro }}</p>
      <p *ngIf="step === 'done'">{{ copy.doneIntro }}</p>
    </div>

    <div class="error-banner" *ngIf="errorMessage">{{ errorMessage }}</div>
    <div class="info-banner" *ngIf="infoMessage && step === 'reset'">{{ infoMessage }}</div>

    <form *ngIf="step === 'request'" [formGroup]="requestForm" (ngSubmit)="submitRequest()" class="auth-form">
      <div class="form-group">
        <label for="email">{{ copy.emailLabel }}</label>
        <input type="email" id="email" formControlName="email" [placeholder]="copy.emailPlaceholder" />
      </div>
      <button type="submit" class="btn-submit" [disabled]="requestForm.invalid || submitting">
        {{ submitting ? copy.sending : copy.sendCode }}
      </button>
    </form>

    <form *ngIf="step === 'reset'" [formGroup]="resetForm" (ngSubmit)="submitReset()" class="auth-form">
      <div class="form-group">
        <label for="token">{{ copy.tokenLabel }}</label>
        <input type="text" id="token" formControlName="token" [placeholder]="copy.tokenPlaceholder" />
      </div>
      <div class="form-group">
        <label for="newPassword">{{ copy.newPasswordLabel }}</label>
        <input type="password" id="newPassword" formControlName="newPassword" [placeholder]="copy.passwordPlaceholder" />
        <small class="field-hint" [class.field-error]="newPasswordControl?.touched && newPasswordControl?.invalid">
          {{ copy.passwordHint }}
        </small>
        <div class="error-text" *ngIf="newPasswordControl?.touched && newPasswordControl?.invalid">
          <span *ngIf="newPasswordControl?.errors?.['required']">{{ copy.newPasswordRequired }}</span>
          <span *ngIf="!newPasswordControl?.errors?.['required'] && newPasswordControl?.errors?.['invalidPassword']">
            {{ copy.passwordInvalid }}
          </span>
        </div>
      </div>
      <button type="submit" class="btn-submit" [disabled]="resetForm.invalid || submitting">
        {{ submitting ? copy.submitting : copy.submit }}
      </button>
    </form>

    <div *ngIf="step === 'done'" class="auth-form">
      <button type="button" class="btn-submit" (click)="goToLogin()">{{ copy.backToSignIn }}</button>
    </div>

    <div class="auth-footer">
      <p>{{ copy.remembered }} <a routerLink="/login">{{ copy.signIn }}</a></p>
    </div>
  </div>
</div>
