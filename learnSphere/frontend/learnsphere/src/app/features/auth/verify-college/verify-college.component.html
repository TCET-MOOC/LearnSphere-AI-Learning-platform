<div class="auth-layout">
  <div class="auth-card">
    <div class="brand">
      <a routerLink="/" class="logo-link" [title]="copy.homeLinkTitle">
        <div class="logo-box">
          <img src="/logo-mark.svg" [alt]="copy.logoAlt" class="logo-img" />
        </div>
      </a>
      <h2>{{ isTeacher ? copy.teacherTitle : copy.studentTitle }}</h2>
      <p *ngIf="isTeacher">{{ copy.teacherIntro }}</p>
      <p *ngIf="!isTeacher">{{ copy.studentIntro }}</p>
    </div>

    <div class="error-banner" *ngIf="errorMessage">{{ errorMessage }}</div>

    <div *ngIf="!submitted">
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
        <div class="form-group">
          <label for="collegeId">{{ copy.collegeLabel }}</label>
          <select id="collegeId" formControlName="collegeId" class="custom-select">
            <option [ngValue]="null" disabled>{{ copy.collegePlaceholder }}</option>
            <option *ngFor="let college of colleges" [ngValue]="college.id">{{ college.name }} — {{ college.city }}</option>
          </select>
        </div>

        <div class="form-group" *ngIf="isTeacher">
          <label for="claimedDepartment">{{ copy.departmentLabel }}</label>
          <input type="text" id="claimedDepartment" formControlName="claimedDepartment" [placeholder]="copy.departmentPlaceholder" />
        </div>

        <div class="form-group" *ngIf="isTeacher">
          <label for="idDocumentUrl">{{ copy.documentLabel }}</label>
          <input type="text" id="idDocumentUrl" formControlName="idDocumentUrl" [placeholder]="copy.documentPlaceholder" />
        </div>

        <button type="submit" class="btn-submit" [disabled]="form.invalid || submitting">
          {{ submitting ? copy.submitting : (isTeacher ? copy.submitTeacher : copy.submitStudent) }}
        </button>
      </form>

      <button type="button" class="btn-secondary" (click)="skipForNow()">{{ copy.skip }}</button>
    </div>

    <div *ngIf="submitted && isTeacher" class="submitted-state">
      <p>{{ copy.submitted }}</p>
      <button type="button" class="btn-submit" (click)="skipForNow()">{{ copy.toDashboard }}</button>
    </div>
  </div>
</div>
