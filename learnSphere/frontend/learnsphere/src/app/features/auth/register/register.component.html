<div class="auth-layout">
  <div class="auth-card">
    <div class="brand">
      <div class="logo-box">LS</div>
      <h2>Create an Account</h2>
      <p>Join LearnSphere to start learning or teaching.</p>
    </div>

    <div class="role-selector">
      <button
        *ngFor="let role of roles"
        type="button"
        class="role-btn"
        [class.active]="selectedRole === role.value"
        (click)="setRole(role.value)">
        {{ role.label }}
      </button>
    </div>

    <div class="error-banner" *ngIf="errorMessage">{{ errorMessage }}</div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" formControlName="fullName" placeholder="e.g. Arjun Mehta" />
      </div>

      <div class="form-group">
        <label for="email">College Email</label>
        <input type="email" id="email" formControlName="email" placeholder="name@college.edu" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" formControlName="password" placeholder="8–16 chars (e.g. Pass@123)" />
        <small class="field-hint" [class.field-error]="passwordControl?.touched && passwordControl?.invalid">
          Must be 8–16 characters with at least 1 uppercase letter, 1 number, and 1 special character.
        </small>
        <div class="error-text" *ngIf="passwordControl?.touched && passwordControl?.invalid">
          <span *ngIf="passwordControl?.errors?.['required']">Password is required.</span>
          <span *ngIf="!passwordControl?.errors?.['required'] && passwordControl?.errors?.['invalidPassword']">
            Password does not meet the complexity requirements.
          </span>
        </div>
      </div>

      <button type="submit" class="btn-submit" [disabled]="registerForm.invalid || submitting">
        {{ submitting ? 'Creating account…' : 'Create Account' }}
      </button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a routerLink="/login">Sign in</a></p>
    </div>
  </div>
</div>
