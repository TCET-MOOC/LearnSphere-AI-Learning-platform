<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" width="100%" height="100%">
  <defs>
    <!-- Foundation Ribbon: Deep Royal Indigo to Electric Indigo -->
    <linearGradient id="lsGradFoundation" x1="20" y1="100" x2="80" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3730A3"/>
      <stop offset="45%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Orbital Ascent Ribbon: Electric Cyan to Luminous Amethyst -->
    <linearGradient id="lsGradOrbit" x1="100" y1="20" x2="40" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Center AI Spark Glow -->
    <filter id="lsSparkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#38BDF8" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Lower Foundation Ribbon ('L' Arc of Learning & Foundation) -->
  <path d="M 28 32 C 16 45 12 62 16 78 C 21 95 35 107 52 108 C 68 109 84 100 92 86 L 76 76 C 71 85 61 90 50 90 C 38 89 28 80 25 68 C 22 58 25 47 32 38 Z"
        fill="url(#lsGradFoundation)"/>

  <!-- Upper Orbital Ribbon ('S' Arc of Sphere, Momentum & Mastery) -->
  <path d="M 92 88 C 104 75 108 58 104 42 C 99 25 85 13 68 12 C 52 11 36 20 28 34 L 44 44 C 49 35 59 30 70 30 C 82 31 92 40 95 52 C 98 62 95 73 88 82 Z"
        fill="url(#lsGradOrbit)"/>

  <!-- Central AI Catalyst Diamond Spark (Intelligence, Illumination, Insight) -->
  <path d="M 60 38 C 60 50 50 60 38 60 C 50 60 60 70 60 82 C 60 70 70 60 82 60 C 70 60 60 50 60 38 Z"
        fill="#FFFFFF"
        filter="url(#lsSparkGlow)"/>
</svg>
