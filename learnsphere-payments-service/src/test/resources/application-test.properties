# Hermetic test profile. PostgreSQL itself comes from Testcontainers.
# Flyway owns the schema; Hibernate only validates it.
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

razorpay.key.id=rzp_test_placeholder
razorpay.key.secret=test-only-razorpay-secret
razorpay.webhook.secret=test-only-webhook-secret
internal.api.key=test-internal-key
main.backend.url=http://localhost:8080
