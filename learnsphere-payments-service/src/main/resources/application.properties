server.port=8081
spring.main.banner-mode=off

# Container and local healthchecks use this endpoint.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Database Configuration (H2 in-memory - uncomment to use)
# spring.datasource.url=jdbc:h2:mem:paymentsdb
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=password
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.h2.console.enabled=true

# PostgreSQL Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/learnsphere_payments}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_TRE1J0tk6PNK0i}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:rzp_test_TRE1J0tk6PNK0i}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:your_webhook_secret}

# Internal Backend Configuration
internal.api.key=${INTERNAL_API_KEY:my_secret_internal_key}
main.backend.url=${MAIN_BACKEND_URL:http://localhost:8080}
