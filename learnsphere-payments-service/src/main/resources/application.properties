server.port=${SERVER_PORT:8081}
spring.main.banner-mode=off
spring.profiles.default=local

# Container and local healthchecks use this endpoint.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# Secrets are supplied through the environment. There is deliberately no
# fallback value: a missing key must fail fast rather than ship a default.
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}
internal.api.key=${INTERNAL_API_KEY}

main.backend.url=${MAIN_BACKEND_URL:http://localhost:8080}
