# Local development: PostgreSQL on the host. Docker Compose supplies the same
# environment names, so this profile works both for `mvnw spring-boot:run` and
# inside the container.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/learnsphere_payments}
spring.datasource.username=${DB_USER:${POSTGRES_USER:postgres}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD:}}
