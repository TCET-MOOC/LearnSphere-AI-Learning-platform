name: CI

# Branch protection must require the "CI gate" check. The workflow itself
# cannot enforce merge blocking; the repository setting does that.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '22'

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: learnsphere-backend
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: learnsphere-backend/pom.xml

      - name: Prepare Maven wrapper
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw

      - name: Run backend tests
        run: ./mvnw -B clean test

      # OpenApiDocumentTests writes target/openapi.json while the suite runs.
      # Failing here means the published contract silently stopped generating.
      - name: Verify OpenAPI document
        run: test -s target/openapi.json

      - name: Upload OpenAPI document
        uses: actions/upload-artifact@v4
        with:
          name: openapi-document
          path: learnsphere-backend/target/openapi.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: learnsphere-backend/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

  payments:
    name: Payments service build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: learnsphere-payments-service
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: learnsphere-payments-service/pom.xml

      - name: Prepare Maven wrapper
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw

      - name: Build and test payments service
        run: ./mvnw -B test

      - name: Upload payments test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payments-surefire-reports
          path: learnsphere-payments-service/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend unit + build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: learnSphere/frontend/learnsphere
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: learnSphere/frontend/learnsphere/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Upload frontend build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: learnSphere/frontend/learnsphere/dist/
          if-no-files-found: warn
          retention-days: 7

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: learnSphere/frontend/learnsphere
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: learnSphere/frontend/learnsphere/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke
        run: npm run e2e
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            learnSphere/frontend/learnsphere/playwright-report/
            learnSphere/frontend/learnsphere/test-results/
          if-no-files-found: warn
          retention-days: 7

  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs:
      - backend
      - payments
      - frontend
      - e2e
    if: always()
    steps:
      - name: Verify every required job passed
        run: |
          echo "backend=${{ needs.backend.result }}"
          echo "payments=${{ needs.payments.result }}"
          echo "frontend=${{ needs.frontend.result }}"
          echo "e2e=${{ needs.e2e.result }}"
          if [[ "${{ needs.backend.result }}" != "success" ||
                "${{ needs.payments.result }}" != "success" ||
                "${{ needs.frontend.result }}" != "success" ||
                "${{ needs.e2e.result }}" != "success" ]]; then
            echo "One or more required jobs failed." >&2
            exit 1
          fi
