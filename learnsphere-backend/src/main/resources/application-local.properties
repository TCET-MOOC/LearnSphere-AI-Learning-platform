# Local development: PostgreSQL on the host. Docker Compose supplies the same
# environment names, so this profile works both for `mvnw spring-boot:run` and
# inside the container.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/MOOC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}
