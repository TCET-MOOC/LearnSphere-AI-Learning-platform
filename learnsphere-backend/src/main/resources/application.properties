spring.application.name=OnlineLearningPlatfrom

spring.datasource.url=jdbc:postgresql://localhost:5432/MOOC
spring.datasource.username=postgres
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

app.jwt.secret=change-this-super-secret-key-for-learnsphere-jwt-signing-please-0123456789
app.jwt.expiration-ms=86400000

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

app.upload.dir=uploads
app.cors.allowed-origins=http://localhost:4200

# NVIDIA NIM AI Configuration
app.ai.nvidia.api-key=${NVIDIA_NIM_API_KEY:}
app.ai.nvidia.base-url=${NVIDIA_NIM_BASE_URL:https://integrate.api.nvidia.com/v1}
app.ai.nvidia.model=${NVIDIA_NIM_MODEL:meta/llama-3.1-70b-instruct}

# Internal API Keys for microservices
internal.api.key=${INTERNAL_API_KEY:my_secret_internal_key}
