spring.application.name=OnlineLearningPlatfrom
spring.main.banner-mode=off

# `local` is the development profile. Production must set the `prod` profile
# explicitly.
spring.profiles.default=local

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

server.port=${SERVER_PORT:8080}

# Container and local healthchecks use this endpoint.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Secrets are supplied through the environment. There is deliberately no
# fallback value: a missing JWT secret or internal key must fail fast.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
internal.api.key=${INTERNAL_API_KEY}

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

app.upload.dir=${APP_UPLOAD_DIR:uploads}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

# NVIDIA NIM AI Configuration
app.ai.nvidia.api-key=${NVIDIA_NIM_API_KEY:}
app.ai.nvidia.base-url=${NVIDIA_NIM_BASE_URL:https://integrate.api.nvidia.com/v1}
app.ai.nvidia.model=${NVIDIA_NIM_MODEL:meta/llama-3.1-70b-instruct}
