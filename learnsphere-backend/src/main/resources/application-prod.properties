# Production: every datasource and public-origin value is mandatory and comes
# from the deployment environment. Secrets are defined in application.properties
# with no fallback, so the service fails fast when they are missing.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

server.forward-headers-strategy=framework
app.upload.dir=${APP_UPLOAD_DIR:/var/lib/learnsphere/uploads}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# The published contract is generated in CI from the test profile. Do not
# expose the full route inventory on a production host.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
