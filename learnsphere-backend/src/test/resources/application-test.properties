# Hermetic test profile. PostgreSQL itself comes from Testcontainers.
# Hibernate builds the throw-away schema until the Flyway baseline lands.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

app.jwt.secret=test-only-jwt-secret-for-testcontainers-0123456789-abcdefghijklmnopqrstuvwxyz
app.jwt.expiration-ms=900000
app.upload.dir=target/test-uploads
app.cors.allowed-origins=http://localhost:4200

app.ai.nvidia.api-key=test-key-not-used
app.ai.nvidia.base-url=https://integrate.api.nvidia.com/v1
app.ai.nvidia.model=meta/llama-3.1-70b-instruct
internal.api.key=test-internal-key

logging.level.org.hibernate.SQL=warn
logging.level.org.hibernate.orm.jdbc.bind=warn
logging.level.org.hibernate.orm.deprecation=error
